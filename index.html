<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星丘炮戰 · CRATER DUEL</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="brand"><span class="mark">✳</span><div>星丘炮戰<small>CRATER DUEL / LOCAL TWO PLAYER</small></div></div><button id="restart">重新開局 ↻</button></header><section class="score"><article class="p1"><span>01 / 珊瑚隊</span><strong id="hp0">100</strong><div class="track"><i id="bar0"></i></div></article><div class="round"><small id="turn">ROUND 01</small><b id="status">珊瑚隊的回合</b><span id="wind">風力 0</span></div><article class="p2"><span>02 / 薄荷隊</span><strong id="hp1">100</strong><div class="track"><i id="bar1"></i></div></article></section><section class="arena"><canvas id="game" width="1100" height="650" aria-label="雙人拋射戰場"></canvas><div class="badge">高地 07 <span>・</span> 星落群島</div><div id="result" class="result" hidden></div></section><section class="controls"><div class="control"><label for="angle">射擊角度 <b id="angleValue">45°</b></label><input id="angle" type="range" min="5" max="175" value="45"><small>← 朝右  /  90° 朝上  /  朝左 →</small></div><div class="control"><label id="chargeLabel">蓄力 <b id="powerValue">0%</b></label><div id="chargeBar" class="charge-bar" role="progressbar" aria-labelledby="chargeLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="chargeFill"></i><span id="chargeMarker"></span></div><small id="chargeHint">按住空白鍵蓄力，放開發射</small><small id="fuel">移動能量 500</small></div><button id="shoot" class="fire">按住蓄力 <span>放開發射 / SPACE</span></button><div class="timer"><b id="timer">30</b><small>回合秒數</small></div></section><section class="items" aria-label="射擊道具"><span>本回合道具</span><button id="item-normal" aria-pressed="true">普通彈</button><button id="item-burst" aria-pressed="false">+2 連發 <small>間隔 0.55 秒 × 3 發</small></button><button id="item-spread" aria-pressed="false">三叉彈 <small>同時射出三個角度</small></button></section><footer><span><kbd>A</kbd><kbd>D</kbd> 移動　 <kbd>W</kbd><kbd>S</kbd> 抬高／壓低炮口　 <kbd>空白</kbd> 按住蓄力、放開發射</span><span>挖開地形，讓對手墜落。<button id="left">移動 ←</button><button id="right">移動 →</button></span></footer></main><script type="module" src="main.js"></script></body></html>
