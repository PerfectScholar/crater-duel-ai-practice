<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星丘炮戰 · CRATER DUEL</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="brand"><span class="mark">✳</span><div>星丘炮戰<small>CRATER DUEL / LOCAL TWO PLAYER</small></div></div><div class="header-actions"><div class="sound-controls"><button id="sound-toggle" type="button" aria-pressed="true">音效：開</button><label for="sound-volume">音量 <span id="volume-value">45%</span></label><input id="sound-volume" type="range" min="0" max="100" value="45" aria-label="音效音量"></div><button id="restart">重新開局 ↻</button></div></header><section class="score"><article class="p1"><span>01 / 珊瑚隊</span><strong id="hp0">500</strong><div class="track"><i id="bar0"></i></div></article><div class="round"><small id="turn">ROUND 01</small><b id="status">珊瑚隊的回合</b><span id="wind">風力 0</span></div><article class="p2"><span>02 / 薄荷隊</span><strong id="hp1">500</strong><div class="track"><i id="bar1"></i></div></article></section><div class="battlefield"><section class="arena"><canvas id="game" width="1100" height="650" aria-label="雙人拋射戰場"></canvas><div class="timer"><b id="timer">30</b><small>回合秒數</small><button id="pass" type="button" title="跳過當前回合">PASS</button></div><div class="badge">高地 07 <span>・</span> 星落群島</div><div id="result" class="result" hidden></div><section class="items" aria-label="射擊道具"></section></section></div><section class="controls"><div class="control"><label for="angle">射擊角度 <b id="angleValue">45°</b></label><input hidden id="angle" type="range" min="5" max="175" value="45"><small>W / S 調整炮口角度</small></div><div class="control"><label id="chargeLabel">蓄力 <b id="powerValue">0%</b></label><div id="chargeBar" class="charge-bar" role="progressbar" aria-labelledby="chargeLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="chargeFill"></i><span id="chargeMarker"></span></div><small id="chargeHint">按住空白鍵蓄力，放開發射</small><small id="fuel">移動能量 500</small></div><button id="shoot" class="fire">按住蓄力 <span>放開發射 / SPACE</span></button></section><section hidden class="tuning" aria-label="炮彈速度測試"><div class="tuning-heading"><b>炮彈速度測試</b><button id="tune-fast">試試近直線</button><button id="tune-reset">還原預設</button></div><div class="tuning-sliders"><div class="control"><label for="tune-gamma">後段加速曲線 γ <b id="gammaValue">2.2</b></label><input id="tune-gamma" type="range" min="1" max="5" step="0.1" value="2.2"><small>越大，速度越集中在接近滿蓄力時增加</small></div><div class="control"><label for="tune-min">最低速度 <b id="minSpeedValue">200</b></label><input id="tune-min" type="range" min="0" max="700" step="10" value="200"><small>0% 蓄力時的初速度（像素／秒）</small></div><div class="control"><label for="tune-max">滿蓄力速度 <b id="maxSpeedValue">700</b></label><input id="tune-max" type="range" min="700" max="6000" step="50" value="700"><small>越快彈道越平直，可先試 3000～6000</small></div></div><p>目前蓄力對應初速度：<b id="speedPreview">200</b> 像素／秒 · 重力維持原設定，調整後於下一次發射生效。</p></section><footer><span><kbd>A</kbd><kbd>D</kbd> 移動　 <kbd>W</kbd><kbd>S</kbd> 抬高／壓低炮口　 <kbd>空白</kbd> 蓄力／發射／飛行中觸發下墜</span><span>挖開地形，讓對手墜落。</span></footer></main><script type="module" src="main.js"></script></body></html>
